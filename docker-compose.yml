# Banco PostgreSQL para desenvolvimento local: `docker compose up -d`
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patotapp
      POSTGRES_PASSWORD: patotapp
      POSTGRES_DB: patotapp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
